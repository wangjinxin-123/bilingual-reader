<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>双语英语文章阅读 | Bilingual Reader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="bilingual_reader.css?v=2">
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.js"></script>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.auth.js"></script>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.database.js"></script>
    <script src="bilingual_reader.js?v=2"></script>
</head>
<body>
    <div class="bg-animation">
        <div class="bg-blob bg-blob-1"></div>
        <div class="bg-blob bg-blob-2"></div>
        <div class="bg-blob bg-blob-3"></div>
        <div class="bg-streaks" id="bg-streaks-container">
        </div>
    </div>
    <div class="fireflies-container">
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
        <div class="firefly"></div>
    </div>
    <div class="app">
        <header class="header">
            <div class="container">
                <div class="header-content">
                    <div class="logo">
                        <span class="logo-icon" id="logo-admin">B</span>
                        <span class="logo-text">Bilingual Reader</span>
                    </div>
                    <nav class="nav">
                        <button class="nav-btn active" data-view="list">文章列表</button>
                        <button class="nav-btn" data-view="upload" id="upload-btn">上传文章</button>
                    </nav>
                </div>
            </div>
        </header>

        <main class="main">
            <div class="container">
                <section id="list-view" class="view active">
                    <div class="search-section">
                        <div class="search-box">
                            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="M21 21l-4.35-4.35"></path>
                            </svg>
                            <input type="text" class="search-input" placeholder="搜索文章标题、关键词或标签..." id="search-input">
                        </div>
                        <div class="tags-filter" id="tags-filter">
                        </div>
                    </div>
                    <div class="articles-grid" id="articles-grid">
                    </div>
                    <div class="empty-state" id="empty-state">
                        <div class="empty-icon">📚</div>
                        <h3>还没有文章</h3>
                        <p>点击右上角"上传文章"开始添加你的第一篇双语文章</p>
                    </div>
                </section>

                <section id="upload-view" class="view">
                    <div class="upload-container">
                        <h1 class="page-title">上传双语文章</h1>
                        <form id="upload-form" class="upload-form">
                            <div class="form-group">
                                <label class="form-label">文章标题</label>
                                <input type="text" class="form-input" id="article-title" placeholder="输入文章标题" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label">标签（用逗号分隔）</label>
                                    <input type="text" class="form-input" id="article-tags" placeholder="例如：科技, 文化, 教育">
                                </div>
                                <div class="form-group">
                                    <label class="form-label">难度等级</label>
                                    <select class="form-input" id="article-level">
                                        <option value="beginner">入门级</option>
                                        <option value="intermediate" selected>中级</option>
                                        <option value="advanced">高级</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-row">
                                <div class="form-group half">
                                    <label class="form-label">英文原文</label>
                                    <textarea class="form-textarea" id="article-english" placeholder="粘贴英文文章内容..." required></textarea>
                                </div>
                                <div class="form-group half">
                                    <label class="form-label">中文译文</label>
                                    <textarea class="form-textarea" id="article-chinese" placeholder="粘贴中文翻译内容..." required></textarea>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn btn-secondary" id="btn-batch">批量导入示例文章</button>
                                <button type="submit" class="btn btn-primary">保存文章</button>
                            </div>
                        </form>
                    </div>
                </section>

                <section id="detail-view" class="view">
                    <button class="back-btn" id="back-btn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"></path>
                        </svg>
                        返回列表
                    </button>
                    <article class="article-detail" id="article-detail">
                    </article>
                </section>

                <div class="article-modal-overlay" id="article-modal-overlay">
                    <div class="article-modal" id="article-modal">
                        <button class="modal-close-btn" id="modal-close-btn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
                                <path d="M18 6L6 18M6 6l12 12"></path>
                            </svg>
                        </button>
                        <div class="modal-content" id="modal-content">
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="bilingual_reader.js"></script>

    <div class="modal-overlay" id="delete-modal">
        <div class="modal">
            <div class="modal-icon">🗑️</div>
            <h3 class="modal-title">确认删除</h3>
            <p class="modal-text">确定要删除这篇文章吗？此操作无法撤销。</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="modal-cancel">取消</button>
                <button class="modal-btn confirm" id="modal-confirm">确认删除</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="edit-modal">
        <div class="modal" style="max-width: 600px;">
            <h3 class="modal-title">编辑文章</h3>
            <form id="edit-form" style="text-align: left;">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label" style="font-size: 13px; margin-bottom: 6px;">文章标题</label>
                    <input type="text" class="form-input" id="edit-title" style="font-size: 14px; padding: 12px 16px;" required>
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label" style="font-size: 13px; margin-bottom: 6px;">标签（用逗号分隔）</label>
                    <input type="text" class="form-input" id="edit-tags" style="font-size: 14px; padding: 12px 16px;">
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label class="form-label" style="font-size: 13px; margin-bottom: 6px;">难度等级</label>
                    <select class="form-input" id="edit-level" style="font-size: 14px; padding: 12px 16px;">
                        <option value="beginner">入门级</option>
                        <option value="intermediate">中级</option>
                        <option value="advanced">高级</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" style="font-size: 13px; margin-bottom: 6px;">英文原文</label>
                    <textarea class="form-textarea" id="edit-english" style="font-size: 14px; padding: 12px 16px; min-height: 150px;" required></textarea>
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" style="font-size: 13px; margin-bottom: 6px;">中文译文</label>
                    <textarea class="form-textarea" id="edit-chinese" style="font-size: 14px; padding: 12px 16px; min-height: 150px;" required></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="modal-btn cancel" id="edit-modal-cancel">取消</button>
                    <button type="submit" class="modal-btn confirm">保存修改</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="admin-modal">
        <div class="modal" style="max-width: 400px;">
            <h3 class="modal-title">管理员登录</h3>
            <form id="admin-form" style="text-align: left;">
                <div class="form-group" style="margin-bottom: 20px;">
                    <label class="form-label" style="font-size: 13px; margin-bottom: 6px;">请输入管理员密钥</label>
                    <input type="password" class="form-input" id="admin-key" style="font-size: 14px; padding: 12px 16px;" placeholder="输入密钥..." required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="modal-btn cancel" id="admin-modal-cancel">取消</button>
                    <button type="submit" class="modal-btn confirm">登录</button>
                </div>
            </form>
            <p id="admin-status" style="margin-top: 15px; font-size: 12px; color: #666; text-align: center; display: none;"></p>
        </div>
    </div>

    <div class="modal-overlay" id="logout-modal">
        <div class="modal">
            <div class="modal-icon">🔒</div>
            <h3 class="modal-title">确认退出登录</h3>
            <p class="modal-text">确定要退出管理员账号吗？</p>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="logout-cancel">取消</button>
                <button class="modal-btn confirm" id="logout-confirm">确认退出</button>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>
</body>
</html>
